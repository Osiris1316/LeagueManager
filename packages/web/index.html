<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <!-- Apply a stored light/dark choice before first paint (see src/theme.ts). -->
    <script>
      try {
        var theme = localStorage.getItem('ui.theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
    <meta name="description" content="Atlantic Canadian RTS Society — Standings, schedules, and match management" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>ACRS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts. To audition another family: add it here, then point --font-crisp / --font-crisp-mono at it in global.css :root -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
